name: Reproduction Smoke Test

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  smoke-test:
    name: Fixture-Based Reproduction Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy

      - name: Verify experiment manifest integrity
        run: |
          python - << 'EOF'
          import json
          from pathlib import Path
          
          manifest_path = Path("submission/results/experiment_manifest.json")
          assert manifest_path.exists(), "experiment_manifest.json missing!"
          
          with open(manifest_path) as f:
              m = json.load(f)
          
          # Verify version
          assert m["experiment_version"] == "v1.1.0-final"
          
          # Verify data accounting
          ds = m["dataset"]
          assert ds["mapped_positive_labels"] == 13818
          assert ds["unknown_positive_labels"] == 2109
          total = ds["mapped_positive_labels"] + ds["unknown_positive_labels"] + ds["confirmed_negative_labels"]
          assert total == 411137, f"Universe mismatch: {total}"
          
          # Verify no test tuning
          assert m["policy"]["test_tuning"] is False
          assert m["policy"]["threshold_source"] == "validation_set_only"
          
          # Verify economic boundary
          assert m["economic_backtest"]["status"] == "NOT_OBSERVABLE"
          
          print("Manifest integrity: PASS")
          print(f"  Universe: {total:,} deployments")
          print(f"  Positives: {ds['mapped_positive_labels']:,}")
          print(f"  Unknowns excluded: {ds['unknown_positive_labels']:,}")
          print(f"  Threshold: {m['policy']['threshold']}")
          print(f"  Test PR-AUC: {m['test_metrics']['pr_auc']}")
          EOF

      - name: Run causal-in-time leakage simulation
        run: |
          python - << 'EOF'
          # Simulate the causal-in-time feature construction gate.
          # In full reproduction, this would run over the parquet data.
          # Here we verify the gate logic is correct on a synthetic fixture.
          
          import random
          random.seed(42)
          
          def build_point_in_time_features(events, t_decision):
              """Only aggregate events strictly before t_decision."""
              history = [e for e in events if e["timestamp"] < t_decision]
              return {
                  "past_launches": sum(1 for e in history if e["type"] == "launch"),
                  "past_buys": sum(1 for e in history if e["type"] == "buy"),
                  "past_sells": sum(1 for e in history if e["type"] == "sell"),
                  "past_burns": sum(1 for e in history if e["type"] == "burn"),
              }
          
          # Fixture: Events around t_decision=1000
          fixture_events = [
              {"timestamp": 900, "type": "launch"},
              {"timestamp": 950, "type": "buy"},
              {"timestamp": 999, "type": "sell"},
              {"timestamp": 1000, "type": "launch"},  # AT decision — must be excluded
              {"timestamp": 1001, "type": "buy"},     # AFTER decision — must be excluded
              {"timestamp": 1100, "type": "burn"},    # AFTER decision — must be excluded
          ]
          
          feats = build_point_in_time_features(fixture_events, t_decision=1000)
          
          assert feats["past_launches"] == 1, f"Expected 1, got {feats['past_launches']}"
          assert feats["past_buys"] == 1
          assert feats["past_sells"] == 1
          assert feats["past_burns"] == 0, f"Expected 0 burns (after t_decision), got {feats['past_burns']}"
          
          print("Causal-in-time leakage gate: PASS")
          print(f"  Features at t=1000: {feats}")
          print("  Events at or after t_decision correctly excluded.")
          EOF

      - name: Run full scientific test suite
        run: |
          pytest submission/tests/ -v

      - name: Run dashboard golden inference test
        run: |
          pytest dashboard/tests/ -v
